# The repository's gate, tools/check.py, and the unit tests in tests/, on every pull request and
# on main. Standard library Python only. main is protected and requires this job, and every
# release is cut from main (docs/adr/003), so nothing reaches the pack's users without it passing.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The gate
        run: python3 tools/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: The release builds, and builds to the same bytes twice
        run: |
          python3 tools/build_release.py --out "$RUNNER_TEMP/a"
          python3 tools/build_release.py --out "$RUNNER_TEMP/b"
          cmp "$RUNNER_TEMP"/a/foothold-*.zip "$RUNNER_TEMP"/b/foothold-*.zip
          cmp "$RUNNER_TEMP/a/release-files.txt" "$RUNNER_TEMP/b/release-files.txt"
