# The repository's gate, tools/check.py, and the agent hooks' own tests, on every pull request
# and on main (card 7020). Standard library Python only. main is protected and requires this
# job, so nothing reaches the pack's users without it passing (docs/adr/002).
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The gate
        run: python3 tools/check.py
      - name: The agent hooks' own tests
        run: python3 .claude/hooks/test_guard.py
